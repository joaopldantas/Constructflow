spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/constructflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Obrigatório (Base64, mín. 32 bytes). Em desenvolvimento, use o profile "dev".
jwt.secret=${JWT_SECRET:}

# Administrador inicial: criado no startup se ainda não existir nenhum ADMIN.
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
